name: Route checks

# vercel.json proxies the games in under this domain, and a one-character
# mistake in a rewrite pattern once 404'd all three of them (see README).
# npm test compiles vercel.json with Vercel's own routing-utils and asserts
# where each path lands, so run it on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  routes:
    name: vercel.json routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
